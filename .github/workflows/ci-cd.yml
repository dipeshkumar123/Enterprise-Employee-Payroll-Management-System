name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, employee-service, attendance-service, payroll-service, gateway-service, service-registry]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          ./mvnw clean test -DskipTests=false -q

  package:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Package all services
        run: |
          cd auth-service && ./mvnw package -DskipTests -q
          cd employee-service && ./mvnw package -DskipTests -q
          cd attendance-service && ./mvnw package -DskipTests -q
          cd payroll-service && ./mvnw package -DskipTests -q
          cd gateway-service && ./mvnw package -DskipTests -q
          cd service-registry && ./mvnw package -DskipTests -q

  docker-build:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest ./auth-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-service:latest ./employee-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/attendance-service:latest ./attendance-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/payroll-service:latest ./payroll-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gateway-service:latest ./gateway-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/service-registry:latest ./service-registry

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/attendance-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/payroll-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gateway-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/service-registry:latest

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via Docker Compose
        run: |
          docker compose down || true
          docker compose up -d --build